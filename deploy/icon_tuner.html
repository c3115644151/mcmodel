<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>GUI Icon Tuner</title>
<style>
:root{--bg:#18181b;--panel:#232327;--panel2:#2d2d32;--line:#3a3a42;--text:#e4e4e7;--muted:#9a9aa3;--accent:#5eead4;--accent2:#2dd4bf;--slot:#8a8a8f}
*{box-sizing:border-box}
body{margin:0;font:13px/1.5 -apple-system,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:grid;grid-template-rows:auto 1fr}
header{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.3px}
header .stat{color:var(--muted);font-size:12px}
header .spacer{flex:1}
header button{background:var(--accent);color:#06231f;border:0;border-radius:5px;padding:6px 14px;font-weight:600;cursor:pointer;font-size:12px}
header button:hover{background:var(--accent2)}
#body{display:grid;grid-template-columns:var(--sidebar,300px) 5px 1fr;min-height:0}
aside{border-right:0;display:flex;flex-direction:column;min-height:0;background:var(--panel)}
#splitter{cursor:col-resize;background:var(--line);position:relative;transition:background .15s}
#splitter:hover,#splitter.drag{background:var(--accent)}
#splitter::after{content:"";position:absolute;inset:0 -3px}
aside .search{padding:10px;border-bottom:1px solid var(--line)}
aside .searchbar{display:flex;gap:8px;align-items:center}
aside input[type=text]{flex:1;min-width:0;padding:7px 9px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:5px;font-size:12px}
aside .cols{display:flex;align-items:center;gap:3px;color:var(--muted);font-size:10px;white-space:nowrap}
aside .cols button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:3px;width:20px;height:24px;cursor:pointer;font-size:13px;line-height:1}
#grid{overflow-y:auto;padding:8px;display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));gap:8px;align-content:start}
.cell{position:relative;width:100%;height:0;padding-bottom:calc(100% - 4px);background:var(--slot);border:2px solid transparent;border-radius:3px;cursor:pointer;overflow:hidden;transition:border-color .12s}
.cell:hover{border-color:var(--muted)}
.cell.sel{border-color:var(--accent)}
.cell img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;image-rendering:pixelated;display:block}
.cell .tag{position:absolute;bottom:0;left:0;right:0;font-size:9px;background:linear-gradient(transparent,#000e);color:#fff;text-align:center;padding:5px 1px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .dot{position:absolute;top:3px;right:3px;width:7px;height:7px;background:var(--accent);border-radius:50%;box-shadow:0 0 0 1px #000}
main{padding:18px 22px;overflow-y:auto;display:grid;grid-template-columns:minmax(360px,1fr) 340px;gap:22px;align-content:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px}
.panel h2{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:0 0 12px;font-weight:600}
.stage{display:flex;gap:16px;align-items:flex-start;justify-content:center}
.tile{text-align:center}
.tile .frame{width:180px;height:180px;background:var(--slot);border:1px solid var(--line);border-radius:4px;display:flex;align-items:center;justify-content:center;position:relative}
.tile .frame img{image-rendering:pixelated;display:block}
.tile .frame.native img{image-rendering:pixelated}
.tile .cap{font-size:11px;color:var(--muted);margin-top:6px}
.badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:10px;background:#3a3a42;color:var(--muted);margin-left:8px}
.badge.on{background:var(--accent);color:#06231f}
.refbar{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.refbar summary{cursor:pointer;font-size:12px;color:var(--muted);user-select:none}
.refbar .refbody{padding-top:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
#refStack{width:180px;height:180px;background:var(--slot);position:relative;display:none;border-radius:4px;flex:none}
#refStack img{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
#refImg{opacity:.5}
.metrics{font-family:ui-monospace,monospace;font-size:11px;color:var(--accent);background:var(--bg);border-radius:5px;padding:10px 12px;margin-top:14px;white-space:pre-wrap;line-height:1.6}
.ctxbar{margin-top:18px}
.ctxcap{font-size:11px;color:var(--muted);margin-bottom:20px}
.ctxrow{display:flex;gap:6px;flex-wrap:nowrap;align-items:flex-start}
.ctxcell{position:relative;width:64px;height:64px;background:#8b8b8b;border:1px solid #373737;flex:0 0 auto}
.ctxcell img{display:block;width:64px;height:64px;image-rendering:pixelated}
.ctxcell.cur{outline:2px solid var(--accent);outline-offset:1px}
.ctxcell em{position:absolute;left:0;top:64px;width:64px;font-size:9px;font-style:normal;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ctl label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:14px 0 5px}
.ctl label b{color:var(--text);font-variant-numeric:tabular-nums;font-weight:500}
.ctl input[type=range]{width:100%;accent-color:var(--accent)}
.ctl .dual{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ctl select,.ctl textarea{width:100%;padding:7px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:5px;font:inherit;font-size:12px}
.ctl textarea{height:56px;resize:vertical}
.ctl .row{display:flex;gap:8px;margin-top:16px}
.ctl button{flex:1;padding:8px;border:0;border-radius:5px;font-weight:600;cursor:pointer;font-size:12px}
.primary{background:var(--accent);color:#06231f}
.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)!important}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#000e;color:#fff;padding:9px 18px;border-radius:6px;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
@media(max-width:1050px){main{grid-template-columns:1fr}}
</style></head><body>
<header>
<h1>GUI Icon Tuner</h1><span class="stat" id="stat"></span><span class="spacer"></span>
<button onclick="saveAll()">保存并同步全部</button>
</header>
<div id="body">
<aside>
<div class="search"><div class="searchbar"><input type="text" id="filter" placeholder="搜索图标名…"><span class="cols"><button onclick="setCols(-1)" title="减少列数">−</button><span id="colLabel">2</span>列<button onclick="setCols(1)" title="增加列数">+</button></span></div></div>
<div id="grid"></div>
</aside>
<div id="splitter"></div>
<main>
<section class="panel">
<h2>预览 <span class="badge" id="badge">默认</span></h2>
<div class="stage">
<div class="tile"><div class="frame"><img id="big" width="180" height="180"></div><div class="cap">放大预览 · 11×</div></div>
<div class="tile"><div class="frame" style="width:96px;height:96px"><img id="native" width="64" height="64"></div><div class="cap">游戏原尺寸 · 4×</div></div>
</div>
<div class="ctxbar">
<div class="ctxcap">相邻对比 · 原尺寸 4×（左三 + 当前 + 右三，当前项跟着微调实时更新）</div>
<div class="ctxrow" id="ctxrow"></div>
</div>
<details class="refbar"><summary>▸ 游戏截图对照（叠加找差异）</summary>
<div class="refbody">
<input type="file" id="refFile" accept="image/png" onchange="loadRef(event)" style="font-size:11px;color:var(--muted)">
<label style="font-size:11px;color:var(--muted)">透明度 <span id="vRef">50%</span></label>
<input type="range" id="refop" min="0" max="100" value="50" oninput="$('vRef').textContent=this.value+'%';$('refImg').style.opacity=this.value/100" style="width:100px;accent-color:var(--accent)">
<div id="refStack"><img id="refBase"><img id="refImg"></div>
</div></details>
<div class="metrics" id="metrics"></div>
</section>
<section class="panel ctl" id="controls">
<h2>微调参数</h2>
<label>目标尺寸 <span><b id="vT">15.7</b> px</span></label>
<input type="range" id="target" min="2" max="16" step="0.1">
<div class="dual">
<div><label>水平 X <span><b id="vX">0.00</b></span></label><input type="range" id="ox" min="-4" max="4" step="0.05"></div>
<div><label>垂直 Y <span><b id="vY">0.00</b></span></label><input type="range" id="oy" min="-4" max="4" step="0.05"></div>
</div>
<label>额外朝向 yaw <span><b id="vR">0</b>°</span></label>
<input type="range" id="yaw" min="-180" max="180" step="1">
<label>对齐方式</label>
<select id="anchor"><option value="auto">自动（按投影高度）</option><option value="center">居中</option><option value="floor">贴底</option></select>
<label>面明暗 <span style="font-size:10px">game = 与游戏一致</span></label>
<select id="shade"><option value="game">游戏阴影（默认）</option><option value="flat">关闭阴影</option></select>
<label>替换源模型</label>
<select id="source"><option value="">（保持默认）</option></select>
<label>备注 <span style="font-size:10px">struct: 开头 = 结构问题需改脚本</span></label>
<textarea id="note" placeholder="例：struct: 缺少左侧扶手"></textarea>
<div class="row">
<button class="primary" onclick="save()">保存此项</button>
<button class="ghost" onclick="reset()">重置</button>
</div>
</section>
</main></div>
<div id="toast"></div>
<script>
let items=[],overrides={},selected=null,sources=[],ver={};
// 缩略图 URL 带版本号：保存后该物品的 proxy 变了，但浏览器会按 URL 缓存图片，
// 不带版本号时左侧格子会继续显示旧图（服务端已发 no-store，仍保险起见）。
function thumbUrl(id,v){return '/api/thumb?item='+encodeURIComponent(id)+'&v='+(v!==undefined?v:(ver[id]||0))}
function visibleItems(){const q=$('filter').value.toLowerCase().trim();return items.filter(i=>i.id.toLowerCase().includes(q))}
const $=x=>document.getElementById(x);
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800)}
function buildGrid(){
const g=$('grid');g.innerHTML='';
visibleItems().forEach(i=>{
const c=document.createElement('div');c.className='cell'+(i.id===selected?' sel':'');c.dataset.id=i.id;
c.innerHTML='<img src="'+thumbUrl(i.id)+'"><div class="tag">'+i.id+'</div>'+(overrides[i.id]?'<div class="dot"></div>':'');
c.onclick=()=>select(i.id);c.title=i.id;g.appendChild(c)})}
function patchCell(id){
const c=document.querySelector('.cell[data-id="'+CSS.escape(id)+'"]');if(!c)return;
const img=c.querySelector('img');if(img)img.src=thumbUrl(id);
if(!c.querySelector('.dot')&&overrides[id]){const d=document.createElement('div');d.className='dot';c.appendChild(d)}
if(c.querySelector('.dot')&&!overrides[id]){const d=c.querySelector('.dot');d.remove()}}
// 相邻对比：把当前项放回它在网格里的 neighbourhood，用同一套原尺寸槽位渲染，
// 这样微调时能直接判断它和一排邻居放一起是否协调。
function renderCtx(curUrl){
const row=$('ctxrow');if(!row)return;row.innerHTML='';
const list=visibleItems();const idx=list.findIndex(i=>i.id===selected);if(idx<0)return;
// 固定 7 格、当前项永远在第 4 格：左右各取 min(3, 余量) 个邻居，缺的位置补空位，
// 这样靠边时布局不跳，也永远不会因为补位而挤到第二行。
const lead=Math.min(3,idx);
const trail=Math.min(3,list.length-1-idx);
const cells=[];
for(let k=0;k<3-lead;k++)cells.push(null);
cells.push(...list.slice(idx-lead,idx+trail+1));
for(let k=0;k<3-trail;k++)cells.push(null);
cells.forEach(i=>{
if(i===null){const ph=document.createElement('div');ph.className='ctxcell';ph.style.visibility='hidden';row.appendChild(ph);return}
const c=document.createElement('div');c.className='ctxcell'+(i.id===selected?' cur':'');
const img=document.createElement('img');
img.src=(i.id===selected&&curUrl)?curUrl:thumbUrl(i.id);
const t=document.createElement('em');t.textContent=i.id;
c.appendChild(img);c.appendChild(t);row.appendChild(c)})}
async function refresh(){await loadOverrides();const d=await(await fetch('/api/items')).json();items=d.items;$('stat').textContent=items.length+' 个物品 · '+Object.keys(overrides).length+' 项已调';buildGrid()}
async function loadOverrides(){const d=await(await fetch('/api/overrides')).json();overrides=d.items||{}}
async function loadSources(){const d=await(await fetch('/api/source-options')).json();sources=d.options||[];const s=$('source');sources.forEach(o=>{const p=document.createElement('option');p.value=o;p.textContent=o.split('/').pop();s.appendChild(p)})}
function candidate(){return{target_px:+$('target').value,offset_x:+$('ox').value,offset_y:+$('oy').value,yaw:+$('yaw').value,anchor:$('anchor').value,source:$('source').value,shade:$('shade').value,note:$('note').value}}
function fill(p){$('target').value=p.target_px??15.7;$('ox').value=p.offset_x??0;$('oy').value=p.offset_y??0;$('yaw').value=p.yaw??0;$('anchor').value=p.anchor??'auto';$('source').value=p.source??'';$('shade').value=p.shade??'game';$('note').value=p.note??'';sync()}
function sync(){$('vT').textContent=(+$('target').value).toFixed(1);$('vX').textContent=(+$('ox').value).toFixed(2);$('vY').textContent=(+$('oy').value).toFixed(2);$('vR').textContent=(+$('yaw').value).toFixed(0)}
let deb;function sched(){clearTimeout(deb);deb=setTimeout(preview,100)}
async function preview(){if(!selected)return;const c=candidate();const r=await fetch('/api/preview?item='+encodeURIComponent(selected)+'&candidate='+encodeURIComponent(JSON.stringify(c)));const d=await r.json();
if(d.error){$('metrics').textContent='ERROR: '+d.error;return}
const url='data:image/png;base64,'+d.png;$('big').src=url;$('native').src=url;$('refBase').src=url;renderCtx(url);
const p=d.report;$('metrics').textContent='target  '+p.target_px+' px      anchor  '+(p.floor_anchor?'floor':'center')+'   shade  '+p.shade+'   |   bounds '+JSON.stringify(p.bounds)+'   |   offset ('+p.offset_x+','+p.offset_y+')  yaw '+p.yaw}
async function select(id){
selected=id;const o=overrides[id]||{};
fill({target_px:o.target_px??15.7,offset_x:o.offset_x??0,offset_y:o.offset_y??0,yaw:o.yaw??0,anchor:o.anchor??'auto',source:o.source??'',shade:o.shade??'game',note:o.note??''});
const on=!!overrides[id];$('badge').textContent=on?'已调':'默认';$('badge').className='badge'+(on?' on':'');
buildGrid();renderCtx();await preview()}
['target','ox','oy','yaw'].forEach(k=>$(k).addEventListener('input',()=>{sync();sched()}));
['anchor','source','shade'].forEach(k=>$(k).addEventListener('change',sched));
async function save(){
if(!selected)return;overrides[selected]=candidate();
const r=await fetch('/api/overrides',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items:overrides})});const d=await r.json();
if(d.error){toast('ERR '+d.error);return}
ver[selected]=(ver[selected]||0)+1;
// 只重画这一格，不重建整个网格：重建会丢滚动位置，也会让整屏图片重新加载。
patchCell(selected);
$('badge').textContent='已调';$('badge').className='badge on';
$('stat').textContent=items.length+' 个物品 · '+Object.keys(overrides).length+' 项已调';
toast('已保存并同步 '+selected+(d.regenerated&&d.regenerated.length?'（proxy 已重建）':'（仅明暗档，无需重建）'));
renderCtx($('big').src)}
async function saveAll(){if(Object.keys(overrides).length){await save();toast('全部已同步到 proxy，可运行生成器落盘')}else toast('暂无 override')}
async function reset(){if(!selected)return;delete overrides[selected];
await fetch('/api/overrides',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items:overrides})});
ver[selected]=(ver[selected]||0)+1;patchCell(selected);$('badge').textContent='默认';$('badge').className='badge';
$('stat').textContent=items.length+' 个物品 · '+Object.keys(overrides).length+' 项已调';
toast('已重置 '+selected);await select(selected)}
function loadRef(ev){const f=ev.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{$('refImg').src=rd.result;$('refStack').style.display='block'};rd.readAsDataURL(f)}
$('filter').addEventListener('input',()=>{buildGrid();renderCtx()});
// Sidebar width + column count are persisted in localStorage.
let sidebarW=+(localStorage.getItem('it_sidebar')||340), cols=+(localStorage.getItem('it_cols')||2);
function applyLayout(){document.documentElement.style.setProperty('--sidebar',sidebarW+'px');document.documentElement.style.setProperty('--cols',cols);$('colLabel').textContent=cols}
function setCols(d){cols=Math.max(2,Math.min(6,cols+d));localStorage.setItem('it_cols',cols);applyLayout()}
(function(){const sp=$('splitter');let dragging=false;
sp.addEventListener('mousedown',e=>{dragging=true;sp.classList.add('drag');document.body.style.cursor='col-resize';e.preventDefault()});
window.addEventListener('mousemove',e=>{if(!dragging)return;sidebarW=Math.max(180,Math.min(720,e.clientX));applyLayout()});
window.addEventListener('mouseup',()=>{if(!dragging)return;dragging=false;sp.classList.remove('drag');document.body.style.cursor='';localStorage.setItem('it_sidebar',sidebarW)})})();
applyLayout();
(async()=>{await loadSources();await refresh();if(items.length)await select(items[0].id)})();
</script></body></html>
