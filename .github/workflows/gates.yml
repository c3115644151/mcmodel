name: gates

# The gates that need neither a Minecraft install nor a Gradle daemon:
# the command table must keep describing the disk, and every authoring source
# must survive the uv audit. Everything that needs the mod working tree runs
# in the mod repository, where this tool is a submodule.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow

      - name: Byte-compile every script
        run: python -m compileall -q deploy mcmodel

      - name: Command table describes the disk
        run: python deploy/test_command_registry.py

      - name: Authoring sources pass the uv audit
        run: python deploy/audit_model_uv_sources.py
